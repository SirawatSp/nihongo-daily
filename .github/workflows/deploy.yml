name: Deploy to GitHub Pages

on:
  push:
    branches: ['claude/japanese-daily-practice-site-mfby3t', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate-content
      - run: npm test
      - name: Build
        # GitHub Pages serves this repo from /SirawatS/.
        run: BASE_PATH=/${{ github.event.repository.name }}/ npm run build
      - name: Add SPA fallback and disable Jekyll
        # Pages has no rewrite rules: a 404.html copy of index.html makes
        # deep links like /settings load the app instead of a 404 page.
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      # Requires a one-time repo setting, since GITHUB_TOKEN cannot enable
      # Pages itself: Settings → Pages → Source: GitHub Actions.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
